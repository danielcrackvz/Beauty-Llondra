<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta | Beauty Llondra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <section class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="auth-card__logo">
        <span>✦</span> BEAUTY LLONDRA
      </a>

      <h1 class="auth-card__title">Crea tu cuenta</h1>
      <p class="auth-card__subtitle">Regístrate para reservar más rápido</p>

      <form class="auth-form" id="registerForm">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" required autocomplete="name">

        <label for="telefono">Teléfono / WhatsApp</label>
        <input type="tel" id="telefono" placeholder="Ej: 71234567" required>

        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="email">

        <label for="password">Contraseña</label>
        <input type="password" id="password" minlength="6" required autocomplete="new-password">

        <p class="auth-form__error" id="registerError"></p>

        <button type="submit" class="btn btn--primary" id="registerSubmit">Crear cuenta</button>
      </form>

      <p class="auth-card__footer">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </p>
    </div>
  </section>

  <script src="js/supabase-config.js"></script>
  <script src="js/session.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
