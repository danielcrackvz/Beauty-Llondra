<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión | Beauty Llondra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <section class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="auth-card__logo">
        <span>✦</span> BEAUTY LLONDRA
      </a>

      <h1 class="auth-card__title">Bienvenida de vuelta</h1>
      <p class="auth-card__subtitle">Ingresa para gestionar tus citas</p>

      <form class="auth-form" id="loginForm">
        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="email">

        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">

        <p class="auth-form__error" id="loginError"></p>

        <button type="submit" class="btn btn--primary" id="loginSubmit">Ingresar</button>
      </form>

      <p class="auth-card__footer">
        ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
      </p>
    </div>
  </section>

  <script src="js/supabase-config.js"></script>
  <script src="js/session.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
